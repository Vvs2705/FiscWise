name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint, type-check, test, build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fiscwise_test
          POSTGRES_USER: fiscwise
          POSTGRES_PASSWORD: fiscwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fiscwise -d fiscwise_test"
          --health-interval 10s --health-timeout 5s --health-retries 5

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://fiscwise:fiscwise@localhost:5432/fiscwise_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-for-ci-at-least-32-chars-long
      ANTHROPIC_API_KEY: test
      VOYAGE_API_KEY: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff mypy pip-audit

      - name: Ruff lint
        working-directory: backend
        run: ruff check app --output-format=github

      - name: Mypy type-check
        working-directory: backend
        run: mypy app --ignore-missing-imports --no-error-summary || true

      - name: pip-audit (dependency CVE scan)
        working-directory: backend
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42974 || true

      - name: Pytest
        working-directory: backend
        run: pytest tests/ -q --tb=short

      - name: Docker build
        run: docker build -f backend/Dockerfile -t fiscwise-backend:${{ github.sha }} .

  frontend:
    name: Frontend — lint, type-check, audit, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run type-check || npx tsc --noEmit

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Vite build
        run: npm run build
