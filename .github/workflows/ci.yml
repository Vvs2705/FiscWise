name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend test and Docker build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fiscwise_test
          POSTGRES_USER: fiscwise
          POSTGRES_PASSWORD: fiscwise
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fiscwise -d fiscwise_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://fiscwise:fiscwise@localhost:5432/fiscwise_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-for-ci-at-least-32-chars-long
      OPENAI_API_KEY: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Pytest
        working-directory: backend
        run: pytest

      - name: Backend Docker build
        run: docker build -f backend/Dockerfile -t fiscwise-backend:${{ github.sha }} .

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript check
        run: npm run type-check

      - name: Vite build
        run: npm run build

  security:
    name: Security Scans (SAST, Dependency, Secrets)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret Scan (Gitleaks)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Python Dependency Scan (pip-audit)
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt
        continue-on-error: true

      - name: Python SAST Scan (Bandit)
        run: |
          pip install bandit
          bandit -r backend/app
        continue-on-error: true

      - name: Node Dependency Scan (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high
        continue-on-error: true
