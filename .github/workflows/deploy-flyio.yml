name: Deploy to Fly.io

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Fly.io
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

      - name: Health check
        run: |
          sleep 30
          curl -f https://contaflow.fly.dev/api/v1/health || exit 1

      - name: Notify result
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "✅ Deployed to https://contaflow.fly.dev"
          else
            echo "❌ Deployment failed — check logs: flyctl logs --app contaflow"
          fi

# Fly.io secrets are managed manually (not via CI) to avoid plaintext exposure:
#   flyctl secrets set DATABASE_URL="..."
#   flyctl secrets set JWT_SECRET_KEY="..."
#   flyctl secrets set SUPABASE_SECRET_KEY="..."
#   flyctl secrets set ADMIN_EMERGENCY_TOKEN="..."
#   flyctl secrets set ADMIN_OPERATIONS_ALLOWED="true"
