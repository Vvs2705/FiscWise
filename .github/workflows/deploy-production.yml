name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  gate:
    name: Production gate — security + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: fiscwise_test
          POSTGRES_USER: fiscwise
          POSTGRES_PASSWORD: fiscwise
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fiscwise -d fiscwise_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://fiscwise:fiscwise@localhost:5432/fiscwise_test
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET_KEY: test-secret-key-for-ci-at-least-32-chars-long

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff pip-audit

      - name: Ruff lint (block on failure)
        working-directory: backend
        run: ruff check app

      - name: pip-audit (block on CRITICAL CVEs)
        working-directory: backend
        run: pip-audit -r requirements.txt

      - name: Pytest (all tests must pass)
        working-directory: backend
        run: pytest tests/ -q --tb=short

      - name: TruffleHog secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: HEAD~1
          extra_args: --only-verified

      - name: Frontend build gate
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

  deploy-backend:
    name: Deploy backend → Fly.io production
    runs-on: ubuntu-latest
    needs: gate
    environment: production

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only

  deploy-frontend:
    name: Deploy frontend → Vercel production
    runs-on: ubuntu-latest
    needs: deploy-backend
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod"
          working-directory: frontend
