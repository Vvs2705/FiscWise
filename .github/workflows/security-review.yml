name: Security Review

permissions:
  pull-requests: write # comentários no PR
  contents: read

on:
  pull_request:

jobs:
  security-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0 # diff completo do PR para o /security-review

      # Autentica pelo plano Claude ativo (token gerado com `claude setup-token`),
      # sem consumo de créditos de API.
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: "/security-review"
