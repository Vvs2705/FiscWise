name: Security Scan

on:
  pull_request:

permissions:
  contents: read

jobs:
  semgrep:
    name: Semgrep (SAST + secrets)
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/security-audit --config p/secrets --error
