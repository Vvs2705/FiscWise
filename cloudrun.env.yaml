# Variáveis NÃO secretas do backend no Google Cloud Run (substitui o [env] do fly.toml).
# Segredos ficam no Google Secret Manager — ver DEPLOY.md e .github/workflows/deploy-cloudrun.yml.
# SUPABASE_URL e GOOGLE_CLIENT_ID vêm das variáveis do repositório no GitHub.
ENVIRONMENT: "production"
DEBUG: "False"
APP_NAME: "FiscWise"
APP_VERSION: "1.0.0"
# URL pública da API. Só o Mercado Pago usa (notification_url do webhook).
# api.fiscwise.com.br não existe (Cloud Run em SP não mapeia domínio): usa a
# URL do próprio Cloud Run. Se um dia houver Worker no domínio, ver DEPLOY.md §10.
PUBLIC_URL: "https://fiscwise-api-45ckqevl6a-rj.a.run.app"
APP_URL: "https://www.fiscwise.com.br"
ALLOWED_ORIGINS: "https://fiscwise.com.br,https://www.fiscwise.com.br,https://fiscwise.pages.dev"
# Cloud Run desliga a instância sem tráfego: rotinas agendadas vêm do Cloud Scheduler.
SCHEDULER_MODE: "external"
RESEND_ENABLED: "true"
# Sentry (projeto fiscwise-api). A DSN é pública por natureza: só permite enviar
# eventos, não ler. Por isso fica aqui e não no Secret Manager.
SENTRY_DSN: "https://d833cb52c3c89ab89cbabb398f03f805@o4511480468013056.ingest.us.sentry.io/4512424955871232"
PAGAMENTOS_GO_LIVE: "false"
