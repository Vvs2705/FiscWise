# Fly.io configuration for FiscWise
# Deploy with: flyctl deploy

app = "contaflow"
primary_region = "gru"  # São Paulo - Brasil (mais próximo)
console_command = "/bin/bash"

[build]
dockerfile = "./backend/Dockerfile"

[deploy]
  # release_command temporarily disabled - migrations need manual investigation
  # release_command = "/bin/sh -c 'cd /app && python run_migrations.py'"

[env]
ENVIRONMENT = "production"
DEBUG = "False"
APP_NAME = "FiscWise"
APP_VERSION = "1.0.0"
PUBLIC_URL = "https://contaflow.fly.dev"
ALLOWED_ORIGINS = "https://fiscwise.com.br,https://fiscwise-v-stack-solution.vercel.app,http://localhost:3000"
SUPABASE_URL = "https://lkgmgbieottygodrdubi.supabase.co"

[http_service]
internal_port = 8000
force_https = true
auto_stop_machines = false
auto_start_machines = true
min_machines_running = 1

[checks]
[checks.http]
grace_period = "120s"
interval = "15s"
method = "GET"
path = "/api/v1/health"
protocol = "http"
timeout = "10s"
type = "http"

# Secrets — set via: flyctl secrets set KEY=value
# JWT_SECRET_KEY       (required)
# DATABASE_URL         (required)
# SUPABASE_SERVICE_KEY (required)
# OPENAI_API_KEY       (required — for fiscal calculator AI features)

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512
