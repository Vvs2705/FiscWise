# fly.toml app configuration file generated for fiscwise on 2026-05-24T09:04:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fiscwise'
primary_region = 'ams'
console_command = '/bin/bash'

[build]
  dockerfile = './backend/Dockerfile'

[deploy]
  release_command = "/bin/sh -c 'cd /app && python run_migrations.py'"

[env]
  ALLOWED_ORIGINS = 'https://fiscwise.com.br,https://fiscwise-v-stack-solution.vercel.app,http://localhost:3000'
  APP_NAME = 'FiscWise'
  APP_VERSION = '1.0.0'
  DEBUG = 'False'
  ENVIRONMENT = 'production'
  PUBLIC_URL = 'https://fiscwise.fly.dev'
  SUPABASE_URL = 'https://lkgmgbieottygodrdubi.supabase.co'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[checks]
  [checks.http]
    type = 'http'
    interval = '15s'
    timeout = '10s'
    grace_period = '2m0s'
    method = 'GET'
    path = '/api/v1/health'
    protocol = 'http'

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 512
