          "applicationSubCategory": "Contabilidade",

          "author": {
            "@id": "https://vstack-solutions.com.br/#organization"
          },
          "creator": {
            "@id": "https://vstack-solutions.com.br/#organization"
          },
          "publisher": {
            "@id": "https://vstack-solutions.com.br/#organization"
          },
          "inLanguage": "pt-BR",
          "countryOfOrigin": "BR"
        },
        {
          "@type": "Organization",
          "@id": "https://vstack-solutions.com.br/#organization",
          "name": "Vstack Solutions",
          "url": "https://vstack-solutions.com.br",

            "Desenvolvimento de Software",

          ]
        },

          "@type": "WebSite",
          "@id": "https://www.fiscwise.com.br/#website",

          "name": "FiscWise",
          "publisher": {
            "@id": "https://vstack-solutions.com.br/#organization"
          },
          "inLanguage": "pt-BR"
        }

    }

    <!-- Evitar flash de tema errado: aplica classe 'dark' antes do React montar -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fw-theme');
          if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {}
      })();
    </script>
