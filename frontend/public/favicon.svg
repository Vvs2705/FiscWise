<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <!-- Background pill quadrado com gradiente -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%"  stop-color="#5B6FEE"/>
      <stop offset="100%" stop-color="#3A52C9"/>
    </linearGradient>
    <linearGradient id="bar3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <rect width="48" height="48" rx="12" fill="url(#bg)"/>

  <!-- Barra 1 — menor, à esquerda -->
  <rect x="7" y="30" width="8" height="12" rx="2" fill="white" opacity="0.55"/>

  <!-- Barra 2 — média, centro -->
  <rect x="20" y="22" width="8" height="20" rx="2" fill="white" opacity="0.78"/>

  <!-- Barra 3 — maior, direita -->
  <rect x="33" y="13" width="8" height="29" rx="2" fill="url(#bar3)"/>

  <!-- Linha de tendência ligando os topos -->
  <path d="M11 30 L24 22 L37 13" stroke="white" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.45"/>

  <!-- Seta de alta no canto superior direito -->
  <path d="M34 8 L41 8 L41 15" stroke="white" stroke-width="2.2"
        stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.9"/>
  <path d="M33 14 L41 8" stroke="white" stroke-width="2.2"
        stroke-linecap="round" fill="none" opacity="0.9"/>
</svg>
